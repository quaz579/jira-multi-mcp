[project]
name = "jira-multi-mcp"
version = "0.0.1"
description = "One MCP server for many Jira Cloud sites"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ben Grossman" }]
dependencies = [
    "fastmcp>=4,<5",
    "httpx>=0.27",
    "anyio>=4",
    "tomli>=2; python_version<'3.11'",
]

[project.scripts]
jira-multi-mcp = "jira_multi_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_multi_mcp"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "respx",
    "anyio",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"src/jira_multi_mcp/cli.py" = ["T20"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: real-network tests against live Jira sites"]
